<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার এআই বিউটি ক্যামেরা</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2e;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .camera-box {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 300px;
            margin: 20px auto;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .controls {
            background: #2b2b3d;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }
        .control-group {
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        label {
            font-size: 14px;
        }
        input[type="range"] {
            width: 60%;
        }
        button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        button:hover {
            background-color: #e84118;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>✨ এআই বিউটি ক্যামেরা ✨</h2>
        
        <div class="camera-box">
            <!-- লাইভ ক্যামেরা ফিড -->
            <video id="webcam" autoplay playsinline></video>
        </div>

        <!-- বিউটি কন্ট্রোল প্যানেল -->
        <div class="controls">
            <div class="control-group">
                <label>উজ্জ্বলতা (Brightness):</label>
                <input type="range" id="brightness" min="100" max="200" value="100">
            </div>
            
            <div class="control-group">
                <label>ত্বক মসৃণ (Blur/Smooth):</label>
                <input type="range" id="smooth" min="0" max="5" step="0.5" value="0">
            </div>

            <div class="control-group">
                <label>রঙের গভীরতা (Contrast):</label>
                <input type="range" id="contrast" min="100" max="150" value="100">
            </div>

            <button id="captureBtn">📸 ছবি তুলুন</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const brightnessSlider = document.getElementById('brightness');
        const smoothSlider = document.getElementById('smooth');
        const contrastSlider = document.getElementById('contrast');

        // ১. ইউজারের ক্যামেরা চালু করার লজিক
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
            } catch (err) {
                alert("ক্যামেরা চালু করা যায়নি! অনুগ্রহ করে পারমিশন দিন।");
                console.error(err);
            }
        }

        // ২. ক্যামেরার ফ্রেমে বিউটি ফিল্টার অ্যাপ্লাই করার লজیک
        function applyFilters() {
            const brightness = brightnessSlider.value;
            const blur = smoothSlider.value;
            const contrast = contrastSlider.value;

            // CSS Filters ব্যবহার করে রিয়েল-টাইম বিউটি ইফেক্ট দেওয়া হচ্ছে
            video.style.filter = `brightness(${brightness}%) blur(${blur}px) contrast(${contrast}%)`;
        }

        // স্লাইডার নাড়ালে সাথে সাথে ফিল্টার আপডেট হবে
        brightnessSlider.addEventListener('input', applyFilters);
        smoothSlider.addEventListener('input', applyFilters);
        contrastSlider.addEventListener('input', applyFilters);

        // ক্যামেরা শুরু করা
        startCamera();
    </script>
</body>
</html>
